#
# This tests the extension-ci-tools works as expected
#

name: Test CI Tools
on:
  push:
    paths-ignore:
      - '*.md'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  test-phase:
    name: Test phase (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  code-quality:
    name: Code Quality
    uses: ./.github/workflows/_extension_code_quality.yml
    with:
      extension_name: quack
      override_repository: duckdb/extension-template
      override_ref: main
      override_ci_tools_repository: ${{ github.repository }}
      ci_tools_version: ${{ github.sha }}
      extra_toolchains: 'python3'

  extension-template-capi:
    name: Extension template (C API)
    uses: ./.github/workflows/_extension_distribution.yml
    with:
      extension_name: capi_quack
      override_repository: duckdb/extension-template-c
      override_ref: main
      duckdb_version: v2.0-cyanoptera
      override_ci_tools_repository: ${{ github.repository }}
      ci_tools_version: ${{ github.sha }}
      extra_toolchains: 'python3;unixodbc'
      # mingw arch below is not opt-in, included to check that it is allowed in the list
      opt_in_archs: 'osx_amd64;windows_arm64;linux_amd64_musl;linux_arm64_musl;windows_amd64_mingw;'
      save_cache: ${{ github.event_name != 'pull_request' }}

  extension-template-custom-runners:
    name: Extension template (custom runners)
    uses: ./.github/workflows/_extension_distribution.yml
    with:
      extension_name: capi_quack
      artifact_postfix: custom-runners
      override_repository: duckdb/extension-template-c
      override_ref: main
      duckdb_version: v2.0-cyanoptera
      override_ci_tools_repository: ${{ github.repository }}
      ci_tools_version: ${{ github.sha }}
      runners: >-
        ${{
          github.repository_owner == 'duckdb'
          && '{"linux_x64":"ubuntu-latest","osx_arm64":"namespace-profile-macos-arm64"}'
          || '{"linux_x64":"ubuntu-latest","osx_arm64":"macos-14"}'
        }}
      exclude_archs: 'linux_arm64;osx_amd64;wasm_base;wasm_threads;windows_amd64_mingw;windows_amd64'
      reduced_ci_mode: disabled
      save_cache: false
      post_build_command: |
        echo "matrix runner: $MATRIX_RUNNER"
        test "$MATRIX_RUNNER" = "ubuntu-latest"

  extension-template-main:
    name: Extension template
    uses: ./.github/workflows/_extension_distribution.yml
    needs:
      - extension-template-capi
      - code-quality
    with:
      extension_name: quack
      override_repository: duckdb/extension-template
      override_ref: main
      duckdb_version: v2.0-cyanoptera
      override_ci_tools_repository: ${{ github.repository }}
      ci_tools_version: ${{ github.sha }}
      extra_toolchains: 'parser_tools;fortran;omp;go;python3;downgraded_aws_cli;'
      reduced_ci_mode: disabled
      save_cache: ${{ github.event_name != 'pull_request' }}
      vcpkg_binary_sources: ${{ github.event_name == 'push' && vars.VCPKG_BINARY_SOURCES || '' }}
      upload_all_extensions: true
      extensions_test_selection: complete
      extra_extension_config: |
        duckdb_extension_load(json)
        duckdb_extension_load(tpch)
    secrets: inherit

  extension-template-main-deploy:
    name: 
    needs:
      - extension-template-main
    uses: ./.github/workflows/_extension_deploy.yml
    with:
      extension_name: quack
      duckdb_version: v2.0-cyanoptera
      override_ci_tools_repository: ${{ github.repository }}
      ci_tools_version: ${{ github.sha }}
      deploy_script: /bin/true
      reduced_ci_mode: enabled

  test-deploy-prepare:
    name: Prepare deploy test
    runs-on: ubuntu-latest
    steps:
      - name: Create synthetic extension artifacts
        shell: bash
        run: |
          mkdir -p deploy-test/linux/v1/linux_amd64
          mkdir -p deploy-test/wasm/v1/wasm_eh
          touch deploy-test/linux/v1/linux_amd64/quack.duckdb_extension
          touch deploy-test/wasm/v1/wasm_eh/quack.duckdb_extension.wasm
      - name: Upload Linux extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-extensions-linux_amd64
          path: deploy-test/linux
          if-no-files-found: error
      - name: Upload Wasm extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-extensions-wasm_eh
          path: deploy-test/wasm
          if-no-files-found: error

  test-deploy:
    name: Test deploy
    needs:
      - test-deploy-prepare
    uses: ./.github/workflows/deploy.yml
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_repository: ${{ github.repository }}
      ci_tools_version: ${{ github.sha }}
      extension_repository: duckdb/extension-template
      extension_ref: main
      deploy_extensions: quack
      deploy_latest: true
      deploy_script: /bin/true

  extension-template-rust:
    name: Extension template (Rust)
    uses: ./.github/workflows/_extension_distribution.yml
    needs:
      - extension-template-capi
      - code-quality
    with:
      extension_name: rusty_quack
      override_repository: duckdb/extension-template-rs
      override_ref: main
      duckdb_version: v2.0-cyanoptera
      override_ci_tools_repository: ${{ github.repository }}
      ci_tools_version: ${{ github.sha }}
      extra_toolchains: 'rust;python3'
      exclude_archs: 'windows_amd64_mingw;wasm_base;wasm_threads' # TODO: remove once fixed upstream
      save_cache: ${{ github.event_name != 'pull_request' }}

  delta-extension-main:
    name: Rust builds (using Delta extension)
    uses: ./.github/workflows/_extension_distribution.yml
    needs:
      - extension-template-capi
      - code-quality
    with:
      extension_name: delta
      override_repository: duckdb/duckdb_delta
      override_ref: main
      override_ci_tools_repository: ${{ github.repository }}
      ci_tools_version: ${{ github.sha }}
      exclude_archs: 'wasm_base;wasm_threads;windows_amd64_mingw;windows_amd64'
      extra_toolchains: 'rust'
      save_cache: ${{ github.event_name != 'pull_request' }}
      vcpkg_binary_sources: ${{ github.event_name == 'push' && vars.VCPKG_BINARY_SOURCES || '' }}
      reduced_ci_mode: enabled
    secrets: inherit
